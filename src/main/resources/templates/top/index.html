<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>TOP画面</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
        }

        .sale-title {
            background-color: rgb(248, 222, 194);
            text-align: center;
            padding: 35px;
            font-size: 30px;
            font-weight: bold;
            margin-bottom: 30px;
		    color: rgb(255, 128, 64);
			font-style: italic;
        }

		.sale-items {
		    display: grid;
		    grid-template-columns: repeat(3, 350px);
		    gap: 30px;
		    justify-content: center;
		}

        .sale-item {
            width: 350px;
        }

		.sale-item img {
		    width: 350px;
		    height: 200px;
		    object-fit: contain;
		    border: 1px solid #ddd;
		}

		/* 4個目を少し右にずらして、下2個を中央にする */
		.sale-item:nth-child(4) {
		    grid-column: 1;
		    transform: translateX(125px);
		}

		.sale-item:nth-child(5) {
		    grid-column: 2;
		    transform: translateX(125px);
		}
    </style>

</head>

<body>
	<!-- 共通ヘッダー -->
	   <div th:replace="~{common/header :: layout-header}"></div>
	   
 </body>

 
    <h1>TOP画面</h1>

    <div class="sale-title">
        ～TIME SALE～
    </div>

    <div class="sale-items">

        <div class="sale-item" th:each="item : ${items}">

            <a th:href="@{/items/detail/{id}(id=${item.id})}">
                <img th:src="${item.image}">
            </a>

        </div>

    </div>

	<!-- 共通フッター -->
		   <div th:replace="~{common/footer :: layout-footer}"></div>
</body>

</html>
