<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>ユーザー新規登録</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
        }

        /* オレンジライン */
        .page-title {
            border-bottom: 30px solid rgb(248, 222, 194);
            padding-bottom: 10px;
            margin-bottom: 30px;
        }

        .register-area {
            width: 500px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 5px;
        }

        input {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
        }

        /* エラーメッセージ */
        .error {
            color: red;
            font-size: 14px;
        }

        /* ボタン */
        .button-area {
            display: flex;
            gap: 100px;
            margin-top: 30px;
        }

        .button-area form {
            margin: 0;
        }

        button {
            background-color: rgb(255, 128, 64);
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.8;
        }
    </style>
</head>

<body>

    <h1 class="page-title">ユーザー新規登録</h1>

    <div class="register-area">

        <form method="post"
              th:action="@{/users/register}"
              th:object="${userRegisterForm}">

            <div class="form-group">
                <label>ユーザー名</label>

                <input type="text"
                       th:field="*{userName}">

                <span class="error"
                      th:errors="*{userName}">
                </span>
            </div>
			
			<div class="form-group">

			    <label>ひらがな表記</label>

			    <input type="text"
			           th:field="*{hiragana}">

			    <span class="error"
			          th:errors="*{hiragana}">
			    </span>

			</div>

			<div class="form-group">

			    <label>電話番号</label>

			    <input type="text"
			           th:field="*{phone}">

			    <span class="error"
			          th:errors="*{phone}">
			    </span>

			</div>

            <div class="form-group">
                <label>メールアドレス</label>

                <input type="email"
                       th:field="*{email}">

                <span class="error"
                      th:errors="*{email}">
                </span>
            </div>

            <div class="form-group">
                <label>パスワード</label>

                <input type="password"
                       th:field="*{password}">

                <span class="error"
                      th:errors="*{password}">
                </span>
            </div>

            <div class="form-group">
                <label>パスワード（確認用）</label>

                <input type="password"
                       th:field="*{confirmPassword}">

                <span class="error"
                      th:errors="*{confirmPassword}">
                </span>
            </div>

            <div class="button-area">

                <button type="submit">
                    登録
                </button>

                <button type="button"
                        onclick="location.href='/cytech/login'">
                    戻る
                </button>

            </div>

        </form>

    </div>

</body>
</html>
