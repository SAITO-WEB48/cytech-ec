<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>口コミ投稿</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
        }

        /* タイトル */
        .page-title {
            border-bottom: 30px solid rgb(248, 222, 194);
            padding-bottom: 10px;
            margin-bottom: 30px;
        }

        /* フォーム全体 */
        .review-form {
            width: 800px;
        }

        /* 項目ごとの間隔 */
        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 6px;
        }

        /* ユーザー名・メールアドレス */
        input[type="text"],
        input[type="email"] {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
        }

        /* 評価 */
        select {
            width: 130px;
            padding: 8px;
        }

        /* コメント */
        textarea {
            width: 100%;
            height: 120px;
            padding: 10px;
            box-sizing: border-box;
            resize: vertical;
        }

        /* 画像 */
        input[type="file"] {
            width: 100%;
        }

        /* 投稿ボタン */
        .button-area {
           
            margin-top: 20px;
        }

        button {
            background-color: rgb(255, 128, 64);
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.8;
        }
    </style>
</head>

<body>
	<!-- 共通ヘッダー -->
	<div th:replace="~{common/header :: layout-header}"></div>

    <h1 class="page-title">口コミ投稿画面</h1>

    <form th:action="@{/reviews/post}"
          method="post"
          enctype="multipart/form-data"
          class="review-form">

        <!-- 商品ID -->
        <input type="hidden"
               name="itemId"
               th:value="${itemId}">

        <!-- ユーザー名 -->
        <div class="form-group">
            <label>ユーザー名（任意）</label>
            <input type="text"
                   name="userName"
                   placeholder="ユーザー名">
        </div>

        <!-- 評価 -->
        <div class="form-group">
            <label>評価</label>

            <select name="rating">
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4">4</option>
                <option value="5">5</option>
            </select>
        </div>

        <!-- メールアドレス -->
        <div class="form-group">
            <label>メールアドレス</label>

            <input type="email"
                   name="email"
                   placeholder="メールアドレス">
        </div>

        <!-- コメント -->
        <div class="form-group">
            <label>コメント</label>

            <textarea name="comment"
                      maxlength="300"></textarea>
        </div>

        <!-- 画像 -->
        <div class="form-group">
            <input type="file"
                   name="image">
        </div>

        <!-- 投稿 -->
        <div class="button-area">
            <button type="submit">投稿</button>
        </div>

    </form>
	<!-- 共通フッター -->
	<div th:replace="~{common/footer :: layout-footer}"></div>
</body>

</html>
