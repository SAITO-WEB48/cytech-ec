<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>購入品詳細</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
        }

        .page-title {
            border-bottom: 30px solid rgb(248, 222, 194);
            padding-bottom: 10px;
            margin-bottom: 30px;
        }

        .purchase-form {
            width: 850px;
        }

        .cart-item {
            border-bottom: 1px solid #ddd;
            padding: 10px 0;
        }

        .form-box {
            border: 1px solid #ddd;
            padding: 20px;
            margin-bottom: 15px;
            width: 500px;
            box-sizing: border-box;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
        }

        input[type="text"] {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
        }

        button {
            background-color: rgb(255, 128, 64);
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 20px;
        }

        button:hover {
            opacity: 0.8;
        }
		
		.header-area {
		    background-color: #202428;
		    color: white;
		    height: 70px;

		    display: flex;
		    align-items: center;

		    padding: 0 50px;
		    gap: 12px;

		    box-sizing: border-box;
		    width: 100%;
		}

		/* 検索部分を横並び */
		.header-search-form {
		    display: flex;
		    align-items: center;
		    gap: 8px;
		}
		
    </style>
</head>

<body>
	<!-- 共通ヘッダー -->
	<div th:replace="~{common/header :: layout-header}"></div>

    <h1 class="page-title">購入品詳細画面</h1>

    <h2>購入商品</h2>

    <div th:each="cartItem : ${cart}" class="cart-item">

        <p>
            商品名：
            <span th:text="${cartItem.item.name}"></span>
        </p>

        <p>
            数量：
            <span th:text="${cartItem.quantity}"></span>個
        </p>

        <p>
            税込価格：
            <span th:text="${cartItem.item.taxIncludedPrice}"></span>円
        </p>

    </div>

    <p>
        合計金額：
        <span th:text="${totalTaxIncludedPrice}"></span>円
    </p>

	<h4>＜受け取り場所＞</h4>

	<form th:action="@{/cart/purchase/confirm}"
	      method="post"
	      class="purchase-form">

        <div class="form-box">

            <div class="form-group">
                <label>名前：</label>
                <input type="text" name="name">
            </div>

            <div class="form-group">
                <label>住所：</label>
                <input type="text" name="address">
            </div>

            <div class="form-group">
                <label>アパート名：</label>
                <input type="text" name="apartment">
            </div>

        </div>


		<h4><お支払情報></h4>
		
        <div class="form-box">

            <div class="form-group">
                <label>カード番号</label>

                <input type="text"
                       name="card"
                       pattern="[0-9]{15}"
                       maxlength="15"
                       placeholder="カード番号"
                       required>
            </div>

            <div class="form-group">
                <label>有効期限</label>

                <input type="text"
                       name="expirationDate"
                       placeholder="DD/YY"
                       maxlength="5"
                       required>
            </div>

        </div>

        <button type="submit">確認</button>

    </form>
	<!-- 共通フッター -->
	<div th:replace="~{common/footer :: layout-footer}"></div>
</body>
</html>
