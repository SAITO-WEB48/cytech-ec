<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
</head>
<body>
	<din>ドロップダウン</din>
	<select name="itemdrop">
		<option th:each="item:${item}" th:value="${item.id}" th:text="$(item.name}"></option>
	</select>
	
	<!-- チェックボックス -->
	<div>チェックボックス</div>
	    <div th:each="item : ${items}">
	        <input type="checkbox" th:id="${item.id}" />
	        <label th:text="${item.name}"></label>
	    </div>

	<!-- ラジオボタン -->
	<div>ラジオボタン</div>
	    <div th:each="item : ${items}">
	        <input type="radio"
	               name="selectedRadio"
	               th:value="${item.id}"
	               th:text="${item.name}" />
	    </div>
	</body>
	</html>
