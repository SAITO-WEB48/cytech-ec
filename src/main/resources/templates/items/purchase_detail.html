<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>購入品詳細</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
        }

        /* 本文部分だけ余白をつける */
        .main-content {
            margin: 40px;
        }

        /* タイトル */
        .page-title {
            border-bottom: 30px solid rgb(248, 222, 194);
            padding-bottom: 10px;
            margin-bottom: 30px;
        }

        /* フォーム全体 */
        .purchase-form {
            width: 850px;
        }

        /* 見出し */
        .section-title {
            margin-top: 30px;
            margin-bottom: 15px;
        }

        /* 入力欄を囲む部分 */
        .form-box {
            border: 1px solid #ddd;
            padding: 20px;
            margin-bottom: 15px;
            width: 700px;
            box-sizing: border-box;
        }

        /* 項目 */
        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
        }

        /* 入力欄 */
        input[type="text"] {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
        }

        /* ラジオボタンと入力欄 */
        .select-area {
            display: flex;
            align-items: flex-start;
            gap: 10px;
        }

        /* 確認ボタン */
        .button-area {
            margin-top: 25px;
        }

        button {
            background-color: rgb(255, 128, 64);
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.8;
        }
    </style>

</head>

<body>

    <!-- 共通ヘッダー -->
    <div th:replace="~{common/header :: layout-header}"></div>


    <main class="main-content">

        <h1 class="page-title">購入品詳細画面</h1>


        <!-- 購入商品 -->
        <h2>購入商品</h2>

        <p>
            商品名：
            <span th:text="${item.name}"></span>
        </p>

        <p>
            合計金額：
            <span th:text="${item.taxIncludedPrice}"></span>円
        </p>


        <form th:action="@{/purchase/confirm}"
              method="post"
              class="purchase-form">


            <!-- 受け取り場所 -->
            <h4 class="section-title">
                ＜受け取り場所＞
            </h4>

            <div class="select-area">

                <input type="radio"
                       name="addressSelect"
                       checked>

                <div class="form-box">

                    <div class="form-group">

                        <label>名前：</label>

                        <input type="text"
                               name="name">

                    </div>


                    <div class="form-group">

                        <label>住所：</label>

                        <input type="text"
                               name="address"
                               placeholder="住所">

                    </div>


                    <div class="form-group">

                        <label>アパート名等：</label>

                        <input type="text"
                               name="apartment"
                               placeholder="アパート名等">

                    </div>

                </div>

            </div>


            <!-- 支払い情報 -->
            <h4 class="section-title">
                ＜お支払い情報＞
            </h4>

            <div class="select-area">

                <input type="radio"
                       name="paymentSelect"
                       checked>

                <div class="form-box">

                    <div class="form-group">

                        <label>カード番号</label>

                        <input type="text"
                               name="card"
                               pattern="[0-9]{15}"
                               maxlength="15"
                               placeholder="カード番号"
                               required>

                    </div>


                    <div class="form-group">

                        <label>有効期限</label>

                        <input type="text"
                               name="expirationDate"
                               placeholder="DD/YY"
                               maxlength="5"
                               required>

                    </div>

                </div>

            </div>


            <!-- 商品ID -->
            <input type="hidden"
                   name="itemId"
                   th:value="${item.id}">


            <div class="button-area">

                <button type="submit">
                    確認
                </button>

            </div>

        </form>

    </main>


    <!-- 共通フッター -->
    <div th:replace="~{common/footer :: layout-footer}"></div>

</body>

</html>
